<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon : SVG pour les navigateurs modernes, .ico en repli (tous deux
         issus de pwa-source.svg, comme les icônes PWA). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA : couleur de la barre système et icône d'accueil iOS
         (iOS ignore le manifest, il lui faut ce lien dédié). -->
    <meta name="theme-color" content="#1D9E75" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>UrbanFlow Mobility</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
